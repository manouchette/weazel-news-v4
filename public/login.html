<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/"><img src="/logo.webp" alt="Weazel News"></a></header><main class="formpage"><form id="f"><label>ESPACE WEAZEL</label><h1>Connexion</h1><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Mot de passe" required><button class="btn red">Se connecter</button><p id="s"></p><a href="/register.html">Créer un compte citoyen</a></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(r.ok)location=d.user.role==="citoyen"?"/citizen.html":"/cms.html";else s.textContent=d.error}</script></body></html>
