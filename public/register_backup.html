<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte citoyen</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/"><img src="/logo.webp" alt="Weazel News"></a></header><main class="formpage"><form id="f"><label>INSCRIPTION CITOYENNE</label><h1>Créer mon compte</h1><input id="name" placeholder="Nom RP" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Mot de passe" required><button class="btn red">Créer mon compte</button><p id="s"></p></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:password.value})}),d=await r.json();if(r.ok)location="/citizen.html";else s.textContent=d.error}</script></body></html>
