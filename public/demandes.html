<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Mes demandes — Weazel News</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        body {
            background: #f5f5f5;
        }

        .requests-page {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        .requests-header {
            background: #050505;
            color: white;
            padding: 35px;
            border-top: 5px solid #e30613;
            margin-bottom: 25px;
        }

        .requests-header small {
            color: #e30613;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .requests-header h1 {
            margin: 8px 0;
            font-size: 34px;
        }

        .requests-header p {
            margin: 0;
            color: #ccc;
        }

        .request-card {
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 18px;
            padding: 25px;
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 15px;
        }

        .request-title {
            margin: 0;
            font-size: 22px;
        }

        .request-category {
            color: #e30613;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .status {
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.approved {
            background: #d4edda;
            color: #155724;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .request-content {
            background: #f7f7f7;
            border-left: 4px solid #e30613;
            padding: 15px;
            white-space: pre-wrap;
            color: #333;
            margin-bottom: 15px;
        }

        .request-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }

        .review-note {
            margin-top: 15px;
            padding: 15px;
            background: #f1f1f1;
            border-left: 4px solid #050505;
        }

        .review-note strong {
            display: block;
            margin-bottom: 5px;
        }

        .empty {
            background: white;
            border: 1px solid #ddd;
            padding: 50px 25px;
            text-align: center;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .btn-profile {
            display: inline-block;
            padding: 12px 18px;
            text-decoration: none;
            font-weight: 700;
            border: 0;
            cursor: pointer;
        }

        .btn-dark {
            background: #050505;
            color: white;
        }

        .btn-red {
            background: #e30613;
            color: white;
        }

        #error {
            color: #d00000;
            font-weight: 700;
            margin-bottom: 15px;
        }

        @media (max-width: 650px) {

            .requests-header {
                padding: 25px;
            }

            .requests-header h1 {
                font-size: 28px;
            }

            .request-top {
                display: block;
            }

            .status {
                display: inline-block;
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <a class="brand" href="/">
        <img src="/logo.webp" alt="Weazel News">
    </a>

    <div>

        <a class="btn dark" href="/profil.html">
            👤 Mon profil
        </a>

        <a class="btn dark" href="/">
            Accueil
        </a>

    </div>

</header>


<main class="requests-page">

    <section class="requests-header">

        <small>ESPACE ABONNÉ</small>

        <h1>📰 Mes demandes</h1>

        <p>
            Retrouvez ici toutes vos demandes envoyées au Weazel News
            et consultez leur état de traitement.
        </p>

    </section>


    <div id="error"></div>

    <div id="requests">

        <div class="empty">
            Chargement de vos demandes...
        </div>

    </div>

</main>


<script>

async function loadRequests() {

    try {

        const response = await fetch("/api/my-posts");

        if (response.status === 401) {

            window.location.href = "/login.html";

            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Impossible de charger les demandes.");
        }

        const container = document.getElementById("requests");

        const posts = Array.isArray(data) ? data : [];

        if (posts.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">📰</div>

                    <h2>Aucune demande</h2>

                    <p>
                        Vous n'avez encore envoyé aucune demande au Weazel News.
                    </p>

                    <a
    class="btn-profile btn-red"
    href="/">
    ← Accueil
</a>

                </div>
            `;

            return;
        }


        container.innerHTML = posts.map(post => {

            const status = post.status || "pending";

            let statusText = "En attente";

            if (status === "approved") {
                statusText = "Validée";
            }

            if (status === "rejected") {
                statusText = "Refusée";
            }

            const date = post.created_at
                ? new Date(post.created_at).toLocaleDateString("fr-FR", {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                })
                : "Date inconnue";


            return `

                <article class="request-card">

                    <div class="request-top">

                        <div>

                            <div class="request-category">
                                ${escapeHtml(post.category || "Demande")}
                            </div>

                            <h2 class="request-title">
                                ${escapeHtml(post.title || "Sans titre")}
                            </h2>

                        </div>

                        <div class="status ${escapeHtml(status)}">
                            ${statusText}
                        </div>

                    </div>


                    <div class="request-content">
                        ${escapeHtml(post.content || "")}
                    </div>


                    <div class="request-info">

                        <span>
                            📅 ${date}
                        </span>

                        <span>
                            🆔 Demande #${post.id}
                        </span>

                    </div>


                    ${
                        post.review_note
                        ?
                        `
                        <div class="review-note">

                            <strong>
                                📝 Réponse du Weazel News
                            </strong>

                            ${escapeHtml(post.review_note)}

                        </div>
                        `
                        :
                        ""
                    }

                </article>

            `;

        }).join("");


    } catch (error) {

        console.error(error);

        document.getElementById("error").textContent =
            error.message || "Impossible de charger vos demandes.";

        document.getElementById("requests").innerHTML = "";

    }

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadRequests();

</script>

</body>
</html>
